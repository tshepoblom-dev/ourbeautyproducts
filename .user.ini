; Upload limits for the registration form (PHP-FPM / CGI hosts read this file; allow up to 5 minutes for it to take effect).
; If your host ignores .user.ini, set the same values in cPanel > MultiPHP INI Editor.
upload_max_filesize = 8M
post_max_size = 20M
max_file_uploads = 5
max_execution_time = 120
